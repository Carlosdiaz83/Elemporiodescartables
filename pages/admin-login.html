<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Administrador - El Emporio Descartables</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,#2A1745 0%,#3E235A 40%,#5B3680 70%,#C298E0 100%)}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:440px;box-shadow:0 25px 50px rgba(0,0,0,.3);text-align:center}
.login-card img{width:90px;height:90px;object-fit:cover;border-radius:50%;margin-bottom:12px}
.form-group{text-align:left;margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:600;color:var(--text-color,#333);margin-bottom:6px}
input{width:100%;padding:12px 14px;border:2px solid var(--border-color,#e2e8f0);border-radius:8px;font-size:15px;box-sizing:border-box;transition:border-color .2s}
input:focus{outline:none;border-color:var(--primary-color,#5B3680)}
button.primary{width:100%;padding:14px;background:var(--primary-color,#5B3680);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;transition:background .2s}
button.primary:hover{background:var(--primary-dark,#3E235A)}
button.primary:disabled{opacity:0.7;cursor:not-allowed}
.hint{font-size:13px;color:var(--text-muted,#666);margin-top:14px}
.badge{display:inline-block;background:#F5F0FA;border:1px solid var(--primary-light,#C298E0);color:var(--primary-dark,#3E235A);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;margin-bottom:12px}
.alert-msg{margin-top:15px;padding:10px 14px;border-radius:8px;font-size:14px;display:none}
.alert-msg.error{display:block;background:#FEE2E2;color:#991B1B;border:1px solid #F87171}
.alert-msg.loading{display:block;background:#E0E7FF;color:#3730A3;border:1px solid #A5B4FC}
.alert-msg.success{display:block;background:#DCFCE7;color:#166534;border:1px solid #86EFAC}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <img src="../img/logo.jpg" alt="El Emporio">
    <div><span class="badge"><i class="fas fa-shield-alt"></i> Panel de Administración</span></div>
    <h2 style="margin-bottom:6px;color:#2A1745">Acceso Administrador</h2>
    <p class="hint" style="margin-top:0;margin-bottom:20px">Ingresá tu correo electrónico y teléfono autorizados</p>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="admin-email"><i class="fas fa-envelope"></i> Correo Electrónico</label>
        <input id="admin-email" type="email" placeholder="ejemplo@gmail.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="admin-phone"><i class="fas fa-phone"></i> Teléfono Celular</label>
        <input id="admin-phone" type="tel" placeholder="Ej: 3511234567 o +54 9 351..." required autocomplete="tel">
      </div>

      <button type="submit" class="primary" id="btn-submit">
        <i class="fas fa-sign-in-alt"></i> Ingresar al Panel
      </button>
    </form>

    <div id="login-msg" class="alert-msg"></div>

    <p class="hint"><a href="../index.html" style="color:var(--primary-color,#5B3680);text-decoration:none"><i class="fas fa-arrow-left"></i> Volver a la tienda</a></p>
  </div>
</div>

<script src="../js/admin-auth.js"></script>
<script>
const form = document.getElementById('admin-login-form');
const btnSubmit = document.getElementById('btn-submit');
const msgBox = document.getElementById('login-msg');

function showMsg(text, type) {
  if (!text) {
    msgBox.style.display = 'none';
    msgBox.className = 'alert-msg';
    msgBox.textContent = '';
    return;
  }
  msgBox.textContent = text;
  msgBox.className = 'alert-msg ' + type;
  msgBox.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('admin-email').value.trim();
  const phone = document.getElementById('admin-phone').value.trim();

  if (!email || !phone) {
    showMsg('Completá ambos campos para continuar.', 'error');
    return;
  }

  showMsg('Verificando credenciales en el servidor seguro…', 'loading');
  btnSubmit.disabled = true;

  try {
    const data = await AdminAuth.validate({ email, phone });
    if (data.ok && data.role === 'admin' && data.token) {
      AdminAuth.setToken(data.token);
      AdminAuth.setPhone(phone);
      AdminAuth.setEmail(email);
      showMsg('¡Acceso concedido! Redirigiendo al panel…', 'success');
      setTimeout(() => {
        window.location.href = '../admin.html';
      }, 700);
    } else {
      showMsg(data.error || 'Correo y teléfono no autorizados para el panel.', 'error');
      btnSubmit.disabled = false;
    }
  } catch (err) {
    showMsg('Error de conexión con el servidor. Verificá tu conexión a internet.', 'error');
    btnSubmit.disabled = false;
  }
});
</script>
</body>
</html>
